<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LOGIC-LAB // PRO CIRCUIT SIMULATOR</title>
    <script type="importmap">
        {
            "imports": {
                "gsap": "https://esm.sh/gsap@3.12.2"
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#050506] text-slate-300 font-sans overflow-hidden select-none touch-none">
    <div id="app" class="flex flex-col h-screen w-screen">
        <!-- Header -->
        <header class="h-14 border-b border-white/10 flex items-center justify-between px-6 bg-[#0a0a0c] z-50 shrink-0 shadow-2xl">
            <div class="flex items-center gap-8">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-cyan-500 rounded-lg flex items-center justify-center shadow-[0_0_15px_rgba(6,182,212,0.5)]">
                        <svg class="w-5 h-5 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    <div>
                        <div class="font-black tracking-tighter text-white text-sm leading-none">LOGIC-LAB</div>
                        <div class="text-[9px] text-cyan-500 font-mono opacity-80 mt-1 uppercase tracking-widest">Advanced Logic Suite</div>
                    </div>
                </div>
                <nav class="hidden lg:flex gap-6 text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500">
                    <button id="btn-algebra" class="hover:text-cyan-400 transition-colors">Boolean Solver</button>
                    <button id="btn-kmap" class="hover:text-cyan-400 transition-colors">K-Map Optimizer</button>
                    <button id="btn-truth-table" class="hover:text-cyan-400 transition-colors">Truth Table</button>
                </nav>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-1 bg-black/40 border border-white/5 rounded-full px-2 py-1">
                    <button id="btn-pause" class="p-1.5 text-cyan-500 hover:bg-white/5 rounded-full transition-all" title="Pause/Resume">
                        <svg id="pause-icon" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
                    </button>
                    <button id="btn-refresh" class="p-1.5 text-slate-400 hover:text-white rounded-full transition-all" title="Restart Clock">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>
                <div class="flex items-center gap-3 px-4 py-1.5 bg-black/40 border border-white/5 rounded-full text-[10px] font-mono text-cyan-400 shadow-inner">
                    <div id="sim-status-dot" class="w-2 h-2 bg-cyan-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(6,182,212,0.8)]"></div>
                    SIM: <span id="sim-time" class="text-white w-12">0.00s</span>
                </div>
                <div class="h-6 w-[1px] bg-white/10 mx-2"></div>
                <button id="btn-save" class="p-2 text-slate-400 hover:text-white transition-all"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg></button>
                <button id="btn-reset" class="p-2 text-red-500/70 hover:text-red-400 transition-all active:scale-90"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
            </div>
        </header>

        <div class="flex-1 flex overflow-hidden">
            <!-- Sidebar: Toolbox -->
            <aside class="hidden md:flex w-64 border-r border-white/5 bg-[#0a0a0c] flex-col z-40 overflow-y-auto custom-scrollbar">
                <div class="p-5 space-y-8">
                    <section>
                        <h3 class="text-[10px] font-bold text-slate-600 uppercase tracking-widest mb-4 flex items-center gap-2">
                            <span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span> Logic Gates
                        </h3>
                        <div class="grid grid-cols-2 gap-3" id="component-list-gates"></div>
                    </section>
                    <section>
                        <h3 class="text-[10px] font-bold text-slate-600 uppercase tracking-widest mb-4 flex items-center gap-2">
                            <span class="w-1.5 h-1.5 bg-purple-500 rounded-full"></span> Memory & Sequential
                        </h3>
                        <div class="grid grid-cols-2 gap-3" id="component-list-sequential"></div>
                    </section>
                    <section>
                        <h3 class="text-[10px] font-bold text-slate-600 uppercase tracking-widest mb-4 flex items-center gap-2">
                            <span class="w-1.5 h-1.5 bg-amber-500 rounded-full"></span> Input / Output
                        </h3>
                        <div class="grid grid-cols-2 gap-3" id="component-list-io"></div>
                    </section>
                </div>
            </aside>

            <!-- Main Workspace -->
            <main class="flex-1 relative overflow-hidden bg-[#050506]">
                <canvas id="workbench-canvas" class="absolute inset-0 w-full h-full cursor-crosshair touch-none"></canvas>
                
                <!-- Mobile Component Bar (Scrollable) -->
                <div class="md:hidden absolute top-0 left-0 right-0 p-3 flex gap-3 overflow-x-auto bg-black/60 backdrop-blur-xl border-b border-white/5 no-scrollbar z-30">
                    <div id="mobile-tools" class="flex gap-3"></div>
                </div>

                <!-- Floating Toolbar -->
                <div class="absolute bottom-8 left-8 flex flex-col gap-3 z-30">
                    <div class="bg-[#141417]/80 backdrop-blur-xl border border-white/10 rounded-xl p-1.5 flex flex-col shadow-2xl overflow-hidden">
                        <button id="zoom-in" class="p-3 hover:bg-white/5 rounded-lg text-slate-400 hover:text-white transition-colors" title="Zoom In"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg></button>
                        <div class="h-[1px] bg-white/5 mx-2"></div>
                        <button id="zoom-out" class="p-3 hover:bg-white/5 rounded-lg text-slate-400 hover:text-white transition-colors" title="Zoom Out"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"></path></svg></button>
                    </div>
                </div>

                <!-- Selection Inspector (Hidden by default) -->
                <div id="inspector" class="absolute top-20 right-8 w-64 bg-[#141417]/95 backdrop-blur-2xl border border-white/10 rounded-2xl shadow-3xl z-40 hidden opacity-0 transition-all duration-300">
                    <div class="p-4 border-b border-white/5 flex justify-between items-center">
                        <h4 class="text-[10px] font-black uppercase tracking-widest text-white" id="ins-type">PROPERTIES</h4>
                        <button class="ins-close text-slate-500 hover:text-white"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                    </div>
                    <div class="p-5 space-y-5" id="ins-body">
                        <!-- Dynamic fields here -->
                    </div>
                    <div class="p-4 bg-white/5 rounded-b-2xl">
                        <button id="ins-delete" class="w-full py-2 rounded-lg bg-red-500/10 text-red-500 text-[10px] font-bold uppercase tracking-widest hover:bg-red-500 hover:text-white transition-all">Destroy Node</button>
                    </div>
                </div>
            </main>
        </div>

        <!-- Logic Analyzer / Waves -->
        <footer id="waveform-panel" class="h-44 border-t border-white/10 bg-[#0a0a0c] flex flex-col z-40 relative shrink-0">
            <div class="flex items-center justify-between px-6 py-2 border-b border-white/5 bg-black/20">
                <div class="flex items-center gap-4">
                    <span class="text-[10px] font-black text-slate-500 uppercase tracking-[0.3em]">Oscilloscope / Trace</span>
                    <div id="active-traces-count" class="text-[9px] text-cyan-500 font-mono">0 TRACES ACTIVE</div>
                </div>
                <div class="flex gap-3">
                    <button id="clear-waveforms" class="text-[9px] text-slate-400 hover:text-white font-bold uppercase px-3 py-1 rounded-md bg-white/5 border border-white/5 transition-colors">Clear Buffer</button>
                    <button id="toggle-waveform" class="p-1 hover:text-white text-slate-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></button>
                </div>
            </div>
            <div class="flex-1 overflow-hidden" id="waveform-container">
                <canvas id="waveform-canvas" class="w-full h-full opacity-80"></canvas>
            </div>
        </footer>

        <!-- Advanced Tools Modal -->
        <div id="modal-container" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-md hidden opacity-0 transition-opacity duration-300 p-4">
            <div class="bg-[#141417] border border-white/10 rounded-3xl w-full max-w-2xl overflow-hidden shadow-[0_0_100px_rgba(0,0,0,0.8)] border-white/10">
                <div class="flex items-center justify-between p-6 border-b border-white/5 bg-white/[0.02]">
                    <div class="flex flex-col">
                        <h2 id="modal-title" class="text-xs font-black text-white uppercase tracking-[0.2em]">Computation Engine</h2>
                        <span class="text-[9px] text-slate-500 font-mono mt-1">LOGIC-LAB // SOLVER_MODULE.SYS</span>
                    </div>
                    <button class="modal-close p-2 text-slate-500 hover:text-white bg-white/5 rounded-full transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <div id="modal-body" class="p-8 overflow-y-auto max-h-[70vh] text-slate-300 custom-scrollbar"></div>
            </div>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
